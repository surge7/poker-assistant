<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette A — Classic Felt + Amber Gold</title>
<style>
  body { margin: 0; padding: 16px; background: #0d2818; font-family: system-ui; color: #e6f0e8; }
  h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #d4a547; }
  .swatch-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .swatch { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: flex-end; padding: 4px; font-size: 9px; color: rgba(255,255,255,0.7); }
  .card { background: #f5f0e8; color: #1a1a1a; border-radius: 10px; width: 56px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.4); font-weight: bold; }
  .suit-red { color: #c0392b; }
  .suit-black { color: #2c3e50; }
  .result-block { background: #122a1c; border: 1px solid #1e4a2e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .action { font-size: 32px; font-weight: 800; color: #d4a547; letter-spacing: 0.08em; }
  .equity { font-size: 20px; color: #52c97a; font-weight: 600; }
</style>
</head>
<body>
  <h2>Variant A — Classic Felt + Amber Gold</h2>
  
  <div class="swatch-row">
    <div class="swatch" style="background:#0d2818">#0d2818</div>
    <div class="swatch" style="background:#122a1c">#122a1c</div>
    <div class="swatch" style="background:#1a3d28">#1a3d28</div>
    <div class="swatch" style="background:#22522f">#22522f</div>
    <div class="swatch" style="background:#d4a547;color:#1a1a1a">#d4a547</div>
    <div class="swatch" style="background:#e6c067;color:#1a1a1a">#e6c067</div>
    <div class="swatch" style="background:#b8862a;color:#fff">#b8862a</div>
    <div class="swatch" style="background:#c0392b">#c0392b</div>
  </div>

  <div class="result-block">
    <div class="action">CALL</div>
    <div class="equity">67% — 71%</div>
    <p style="color:#8b9e8f; font-size:13px">Префлоп. Пара тузов. Сильная рука.</p>
  </div>
  
  <div style="display:flex; gap:8px">
    <div class="card"><span style="font-size:18px">A</span><span class="suit-red">♥</span></div>
    <div class="card"><span style="font-size:18px">K</span><span class="suit-black">♠</span></div>
    <div class="card" style="border:2px dashed #22522f; background:transparent; color:#22522f">+</div>
  </div>
</body>
</html>
