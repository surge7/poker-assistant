<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette C — Deep Teal + Champagne</title>
<style>
  body { margin: 0; padding: 16px; background: #0a1e1e; font-family: system-ui; color: #e0ecea; }
  h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #d4c49c; }
  .swatch-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .swatch { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: flex-end; padding: 4px; font-size: 9px; color: rgba(255,255,255,0.7); }
  .card { background: #f8f5ef; color: #1a1a1a; border-radius: 10px; width: 56px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.4); font-weight: bold; }
  .suit-red { color: #c0322c; }
  .suit-black { color: #0a2a2a; }
  .result-block { background: #102828; border: 1px solid #1a3c3c; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .action { font-size: 32px; font-weight: 800; color: #d4c49c; letter-spacing: 0.08em; }
  .equity { font-size: 20px; color: #4ab8a0; font-weight: 600; }
</style>
</head>
<body>
  <h2>Variant C — Deep Teal + Champagne</h2>
  
  <div class="swatch-row">
    <div class="swatch" style="background:#0a1e1e">#0a1e1e</div>
    <div class="swatch" style="background:#102828">#102828</div>
    <div class="swatch" style="background:#1a3c3c">#1a3c3c</div>
    <div class="swatch" style="background:#225050">#225050</div>
    <div class="swatch" style="background:#d4c49c;color:#1a1a1a">#d4c49c</div>
    <div class="swatch" style="background:#e8dab4;color:#1a1a1a">#e8dab4</div>
    <div class="swatch" style="background:#b4a070;color:#fff">#b4a070</div>
    <div class="swatch" style="background:#c0322c">#c0322c</div>
  </div>

  <div class="result-block">
    <div class="action">CALL</div>
    <div class="equity">67% — 71%</div>
    <p style="color:#80aaa8; font-size:13px">Префлоп. Пара тузов. Сильная рука.</p>
  </div>
  
  <div style="display:flex; gap:8px">
    <div class="card"><span style="font-size:18px">A</span><span class="suit-red">♥</span></div>
    <div class="card"><span style="font-size:18px">K</span><span class="suit-black">♠</span></div>
    <div class="card" style="border:2px dashed #225050; background:transparent; color:#225050">+</div>
  </div>
</body>
</html>
