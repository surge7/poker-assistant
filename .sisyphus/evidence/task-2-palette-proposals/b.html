<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette B — Dark Emerald + Brass</title>
<style>
  body { margin: 0; padding: 16px; background: #061a10; font-family: system-ui; color: #d4e8d8; }
  h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #c8956c; }
  .swatch-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .swatch { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: flex-end; padding: 4px; font-size: 9px; color: rgba(255,255,255,0.7); }
  .card { background: #fff8f0; color: #1a1a1a; border-radius: 10px; width: 56px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.5); font-weight: bold; }
  .suit-red { color: #d44a3a; }
  .suit-black { color: #1a2a1a; }
  .result-block { background: #0a2218; border: 1px solid #143020; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .action { font-size: 32px; font-weight: 800; color: #c8956c; letter-spacing: 0.08em; }
  .equity { font-size: 20px; color: #4db870; font-weight: 600; }
</style>
</head>
<body>
  <h2>Variant B — Dark Emerald + Brass</h2>
  
  <div class="swatch-row">
    <div class="swatch" style="background:#061a10">#061a10</div>
    <div class="swatch" style="background:#0a2218">#0a2218</div>
    <div class="swatch" style="background:#143020">#143020</div>
    <div class="swatch" style="background:#1c4228">#1c4228</div>
    <div class="swatch" style="background:#c8956c;color:#1a1a1a">#c8956c</div>
    <div class="swatch" style="background:#e0b484;color:#1a1a1a">#e0b484</div>
    <div class="swatch" style="background:#a67040;color:#fff">#a67040</div>
    <div class="swatch" style="background:#d44a3a">#d44a3a</div>
  </div>

  <div class="result-block">
    <div class="action">CALL</div>
    <div class="equity">67% — 71%</div>
    <p style="color:#6a9e7a; font-size:13px">Префлоп. Пара тузов. Сильная рука.</p>
  </div>
  
  <div style="display:flex; gap:8px">
    <div class="card"><span style="font-size:18px">A</span><span class="suit-red">♥</span></div>
    <div class="card"><span style="font-size:18px">K</span><span class="suit-black">♠</span></div>
    <div class="card" style="border:2px dashed #1c4228; background:transparent; color:#1c4228">+</div>
  </div>
</body>
</html>
